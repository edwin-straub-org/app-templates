stages:
  - build
  - deploy

variables:
  IMAGE_NAME: ghcr.io/edwin-straub-org/${CI_PROJECT_NAME}
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git clone https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/edwin-straub-org/dxp.git platform-repo
    - cd platform-repo
    
    # Generate claim for dev
    - |
      cat > environments/local/dev/applications/${CI_PROJECT_NAME}.yaml <<EOF
      apiVersion: platform.muller.dxp.de/v1alpha1
      kind: ApplicationClaim
      metadata:
        name: ${CI_PROJECT_NAME}
        namespace: local-dev-apps
      spec:
        environment: local
        stage: dev
        appName: ${CI_PROJECT_NAME}
        image: $IMAGE_NAME:$IMAGE_TAG
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${CI_PROJECT_NAME}
        namespace: local-dev-apps
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ${CI_PROJECT_NAME}
        template:
          metadata:
            labels:
              app: ${CI_PROJECT_NAME}
          spec:
            containers:
              - name: app
                image: $IMAGE_NAME:$IMAGE_TAG
                ports:
                  - containerPort: 8080
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: ${CI_PROJECT_NAME}
        namespace: local-dev-apps
      spec:
        selector:
          app: ${CI_PROJECT_NAME}
        ports:
          - port: 80
            targetPort: 8080
      EOF
    
    # Generate claim for test
    - sed 's/dev/test/g' environments/local/dev/applications/${CI_PROJECT_NAME}.yaml > environments/local/test/applications/${CI_PROJECT_NAME}.yaml
    
    - git config user.email "ci@platform.local"
    - git config user.name "Platform CI"
    - git add environments/
    - git commit -m "Deploy ${CI_PROJECT_NAME}:${IMAGE_TAG}"
    - git push origin main
